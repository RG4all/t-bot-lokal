{# Dokumentations-Button samt einklappbarem Panel für die Backtesting-Oberfläche. #}
{# Lädt docs/backtesting.md serverseitig gerendert (identisch zur Hilfe) nach. #}
<button class="btn btn-outline-primary"
        type="button"
        id="documentation-toggle"
        data-fragment-url="{% url 'documentation_fragment' 'backtesting' %}"
        data-full-url="{% url 'documentation' 'backtesting' %}"
        aria-controls="documentation-panel"
        aria-expanded="false">Dokumentation</button>
<div class="card border-0 shadow-sm mt-3 d-none" id="documentation-panel">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span class="fw-semibold" id="documentation-title">Backtesting-Dokumentation</span>
    <span class="d-flex gap-2">
      <a class="btn btn-sm btn-outline-secondary" id="documentation-full-link" href="{% url 'documentation' 'backtesting' %}">Als Seite öffnen</a>
      <button class="btn btn-sm btn-outline-secondary" type="button" id="documentation-close">Schließen</button>
    </span>
  </div>
  <div class="card-body doc-panel">
    <div class="manual-content" id="documentation-content">
      <p class="text-muted mb-0">Dokumentation wird geladen …</p>
    </div>
  </div>
</div>
<script>
(function () {
  const toggle = document.getElementById("documentation-toggle");
  const panel = document.getElementById("documentation-panel");
  const content = document.getElementById("documentation-content");
  const title = document.getElementById("documentation-title");
  const closeButton = document.getElementById("documentation-close");
  if (!toggle || !panel || !content) { return; }
  let loaded = false;

  async function loadDocument() {
    if (loaded) { return; }
    try {
      const response = await fetch(toggle.dataset.fragmentUrl, {
        headers: { "X-Requested-With": "XMLHttpRequest" },
      });
      if (!response.ok) { throw new Error("HTTP " + response.status); }
      const payload = await response.json();
      content.innerHTML = payload.html;
      if (title && payload.title) { title.textContent = payload.title; }
      loaded = true;
    } catch (error) {
      content.innerHTML =
        '<div class="alert alert-warning mb-0">Dokumentation konnte nicht geladen werden (' +
        String(error) +
        '). <a href="' + toggle.dataset.fullUrl + '">Als eigene Seite öffnen</a>.</div>';
    }
  }

  function setOpen(open) {
    panel.classList.toggle("d-none", !open);
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    toggle.classList.toggle("active", open);
    if (open) { loadDocument(); }
  }

  toggle.addEventListener("click", function () {
    setOpen(panel.classList.contains("d-none"));
  });
  if (closeButton) {
    closeButton.addEventListener("click", function () { setOpen(false); });
  }
})();
</script>
