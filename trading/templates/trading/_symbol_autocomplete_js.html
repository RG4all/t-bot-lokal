<script>
(() => {
  "use strict";
  const input = document.getElementById("id_symbols");
  const exchange = document.getElementById("id_exchange");
  const market = document.getElementById("id_market");
  const list = document.getElementById("symbol-suggestions");
  if (!input || !exchange || !market || !list) return;
  let timer = null;
  let requestController = null;

  function currentToken() {
    return input.value.split(",").at(-1).trim().toUpperCase();
  }
  function selectSymbol(symbol) {
    const parts = input.value.split(",");
    parts[parts.length - 1] = " " + symbol;
    input.value = parts.map(part => part.trim()).filter(Boolean).join(", ") + ", ";
    list.classList.add("d-none");
    input.focus();
  }
  async function loadSuggestions() {
    if (requestController) requestController.abort();
    requestController = new AbortController();
    const query = new URLSearchParams({exchange: exchange.value, market: market.value, q: currentToken()});
    try {
      const response = await fetch("{% url 'symbol_suggestions_api' %}?" + query, {signal: requestController.signal});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      list.replaceChildren();
      payload.suggestions.forEach(symbol => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "list-group-item list-group-item-action py-1";
        button.textContent = symbol;
        button.addEventListener("click", () => selectSymbol(symbol));
        list.append(button);
      });
      list.classList.toggle("d-none", payload.suggestions.length === 0);
    } catch (error) {
      if (error.name !== "AbortError") list.classList.add("d-none");
    }
  }
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(loadSuggestions, 250);
  }
  input.addEventListener("input", schedule);
  input.addEventListener("focus", schedule);
  exchange.addEventListener("change", loadSuggestions);
  market.addEventListener("change", loadSuggestions);
  document.addEventListener("click", event => {
    if (!list.contains(event.target) && event.target !== input) list.classList.add("d-none");
  });
})();
</script>
<script>
(() => {
  "use strict";
  const button = document.getElementById("scan-markets");
  const allButton = document.getElementById("scan-all-markets");
  const exchange = document.getElementById("id_exchange");
  const market = document.getElementById("id_market");
  const input = document.getElementById("id_symbols");
  const message = document.getElementById("market-scan-message");
  const warning = document.getElementById("market-risk-warning");
  const table = document.getElementById("market-scan-table-wrap");
  const rows = document.getElementById("market-scan-rows");
  const use = document.getElementById("use-market-selection");
  const volatility = document.getElementById("scanner-volatility");
  const volumeSpike = document.getElementById("scanner-volume-spike");
  const marketCapRatio = document.getElementById("scanner-market-cap");
  const orderbookRatio = document.getElementById("scanner-orderbook");
  if (!button || !exchange || !market || !input || !message || !warning || !table || !rows || !use || !volatility || !volumeSpike || !marketCapRatio || !orderbookRatio) return;
  let abortController = null;

  document.querySelectorAll(".scanner-filter").forEach(slider => {
    const output = document.getElementById(slider.dataset.output);
    const update = () => {
      output.textContent = `${Number(slider.value).toLocaleString("de-DE")}${slider.dataset.suffix}`;
    };
    slider.addEventListener("input", update);
    update();
  });

  function percent(value) {
    return value === null || value === undefined ? "–" : `${Number(value).toFixed(2)} %`;
  }
  function ratio(value) {
    return value === null || value === undefined ? "nicht belegt" : `${(Number(value) * 100).toFixed(1)} %`;
  }
  function addCell(row, value) {
    const cell = document.createElement("td");
    cell.textContent = value;
    row.append(cell);
  }
  function render(payload) {
    rows.replaceChildren();
    const snapshots = payload.exchanges
      ? Object.entries(payload.exchanges).map(([name, snapshot]) => [name, snapshot])
      : [[payload.exchange || exchange.value, payload]];
    const candidates = snapshots.flatMap(([name, snapshot]) => [
      ...(snapshot.gainers || []).map(item => ({...item, direction: `${name} · Gainer`})),
      ...(snapshot.losers || []).map(item => ({...item, direction: `${name} · Loser`}))
    ]);
    candidates.forEach(item => {
      const row = document.createElement("tr");
      addCell(row, item.direction);
      addCell(row, item.symbol);
      addCell(row, percent(item.change_24h));
      addCell(row, item.volume_spike ? `ja (${item.volume_ratio}×)` : "nein");
      addCell(row, ratio(item.liquidity_ratio));
      addCell(row, ratio(item.orderbook_depth_ratio));
      addCell(row, item.fundamental_reason || "geprüft");
      const cell = document.createElement("td");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "form-check-input market-choice";
      checkbox.value = item.symbol;
      checkbox.checked = true;
      checkbox.addEventListener("change", () => {
        use.disabled = !document.querySelector(".market-choice:checked");
      });
      cell.append(checkbox);
      row.append(cell);
      rows.append(row);
    });
    table.classList.toggle("d-none", candidates.length === 0);
    use.disabled = candidates.length === 0;
    warning.textContent = payload.risk_warning || "Volatile Märkte sind riskant. Stop-Loss verwenden.";
    warning.classList.remove("d-none");
    message.textContent = candidates.length
      ? `${candidates.length} qualifizierte Märkte gefunden (${payload.generated_at || "aktuell"}).`
      : "Keine Märkte erfüllen derzeit alle konservativen Filter. Es werden keine Symbole automatisch ergänzt.";
    message.className = `small mt-3 ${candidates.length ? "text-success" : "text-warning"}`;
  }
  async function scan(allExchanges = false) {
    if (abortController) abortController.abort();
    abortController = new AbortController();
    button.disabled = true;
    if (allButton) allButton.disabled = true;
    message.textContent = "Öffentliche 24h-Ticker und Orderbücher werden geprüft …";
    message.className = "small mt-3 text-muted";
    try {
      const query = new URLSearchParams({
        exchange: allExchanges ? "all" : exchange.value,
        market: market.value,
        volatility_threshold: volatility.value,
        volume_spike_multiple: volumeSpike.value,
        min_volume_market_cap_ratio: String(Number(marketCapRatio.value) / 100),
        min_orderbook_depth_ratio: String(Number(orderbookRatio.value) / 100)
      });
      const response = await fetch("{% url 'market_opportunities_api' %}?" + query, {signal: abortController.signal});
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      render(payload);
    } catch (error) {
      if (error.name !== "AbortError") {
        message.textContent = `Marktdaten konnten nicht geladen werden: ${error.message}`;
        message.className = "small mt-3 text-danger";
        table.classList.add("d-none");
      }
    } finally {
      button.disabled = false;
      if (allButton) allButton.disabled = false;
    }
  }
  use.addEventListener("click", () => {
    const selected = [...document.querySelectorAll(".market-choice:checked")].map(item => item.value);
    if (!selected.length) return;
    const current = input.value.split(",").map(item => item.trim()).filter(Boolean);
    input.value = [...new Set([...current, ...selected])].join(", ");
    input.dispatchEvent(new Event("input", {bubbles: true}));
  });
  button.addEventListener("click", () => scan(false));
  allButton?.addEventListener("click", () => scan(true));
  exchange.addEventListener("change", () => { table.classList.add("d-none"); warning.classList.add("d-none"); });
  market.addEventListener("change", () => { table.classList.add("d-none"); warning.classList.add("d-none"); });
})();
</script>
