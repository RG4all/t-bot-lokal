# Copieren nach .github/workflows/quality.yml (diese GitHub-App hat keine workflows-Push-Rechte;
# der Maintainer uebernimmt diese Datei mit seinen Rechten, siehe ci/README.md).
name: quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      AUTOSTART_BOTS: "False"
      DEBUG: "True"
      RENDER: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Runtime-Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Doku-Waechter (Links, Anker, Orphans, Konventionen)
        run: python3 scripts/check_docs.py
      - name: Django-Systemcheck, Migrations- und Statische-Assets-Pruefung
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
      - name: Django-/Python-Tests
        run: python manage.py test --noinput
      - name: Lint Python
        run: ruff check .
      - name: Shell-Testsuite
        run: bash tests/run_tests.sh
      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install.sh hardware-test.sh docker-entrypoint.sh docker/*.sh scripts/*.sh tests/*.sh
      - name: Pip-Konsistenz
        run: python -m pip check
