name: t-bot-local

x-app-environment: &app-environment
  DEBUG: "True"
  RENDER: "False"
  SECRET_KEY: ${SECRET_KEY:-django-insecure-local-compose-only}
  PASSPHRASE: ${PASSPHRASE:-local-t-bot}
  # Der lokale Compose-Stack benötigt standardmäßig weder Gate noch Passwort.
  # In einer geschützten Umgebung explizit PASSPHRASE_GATE_ENABLED=True setzen.
  PASSPHRASE_GATE_ENABLED: ${PASSPHRASE_GATE_ENABLED:-False}
  DATABASE_URL: postgresql://${POSTGRES_USER:-tbot}:${POSTGRES_PASSWORD:-tbot-local-password}@postgres:5432/${POSTGRES_DB:-tbot}
  DATABASE_SSL_REQUIRE: "False"
  REDIS_URL: redis://redis:6379/0
  EXCHANGE_API_KEY: ${EXCHANGE_API_KEY:-}
  EXCHANGE_SECRET_KEY: ${EXCHANGE_SECRET_KEY:-}
  BACKTEST_LOCAL_FALLBACK_ENABLED: "True"
  AUTOSTART_BOTS: ${AUTOSTART_BOTS:-True}
  CELERY_WORKER_MAX_MEMORY_PER_CHILD: "384000"
  BACKTEST_MAX_COMBINATIONS: ${BACKTEST_MAX_COMBINATIONS:-20000}
  BACKTEST_MAX_PRICE_POINTS: ${BACKTEST_MAX_PRICE_POINTS:-5000}
  BACKTEST_DEFAULT_PRICE_POINTS: ${BACKTEST_DEFAULT_PRICE_POINTS:-5000}

# Gemeinsam genutzter Ordner fuer die vom `tuner`-Container generierte
# Hardware-Optimierungsdatei. Wird von allen App-Containern gemountet.
x-tuning-volume: &tuning-volume
  - tuning_runtime:/tbot-runtime:ro

services:
  # --------------------------------------------------------------------------
  # One-Shot: Hardware-Analyse & Tuning-Datei generieren.
  # Laeuft VOR redis/postgres/web/worker/beat und schreibt tuning.env in das
  # gemeinsame Volume. Alle nachfolgenden Container lesen diese Werte und
  # passen Redis-Parameter, Worker-Speicher, DB-Pools und CPU-Limits an.
  # --------------------------------------------------------------------------
  tuner:
    build: .
    image: t-bot-local-app
    init: true
    command: ["/app/docker/tuner-entrypoint.sh"]
    environment:
      <<: *app-environment
    volumes:
      - tuning_runtime:/tbot-runtime
    restart: "no"

  postgres:
    image: postgres:17-alpine
    # Der Custom-Entrypoint liest /tbot-runtime/tuning.env und uebergibt die
    # automatisch berechneten Werte (max_connections, shared_buffers,
    # effective_cache_size, work_mem) als postgres -c Argumente.
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-entrypoint.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tbot}
      POSTGRES_USER: ${POSTGRES_USER:-tbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbot-local-password}
      # Override in .env moeglich; werden vom Tuner sonst ueberschrieben.
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-40}
      POSTGRES_SHARED_BUFFERS_MB: ${POSTGRES_SHARED_BUFFERS_MB:-32}
      POSTGRES_EFFECTIVE_CACHE_MB: ${POSTGRES_EFFECTIVE_CACHE_MB:-128}
      POSTGRES_WORK_MEM_MB: ${POSTGRES_WORK_MEM_MB:-4}
    volumes:
      - ./docker/postgres-entrypoint.sh:/usr/local/bin/postgres-entrypoint.sh:ro
      - postgres_data:/var/lib/postgresql/data
      - tuning_runtime:/tbot-runtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tbot} -d ${POSTGRES_DB:-tbot}"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: ${POSTGRES_MEMORY:-256m}
    cpus: "${POSTGRES_CPUS:-0.50}"
    restart: unless-stopped
    depends_on:
      tuner:
        condition: service_completed_successfully

  redis:
    image: redis:7.4-alpine
    # Der Custom-Entrypoint liest /tbot-runtime/tuning.env und startet
    # redis-server mit den automatisch berechneten Werten fuer maxmemory,
    # maxmemory-policy und io-threads.
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint.sh"]
    environment:
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-48mb}
    volumes:
      - ./docker/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
      - tuning_runtime:/tbot-runtime:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: ${REDIS_MEMORY:-96m}
    cpus: "${REDIS_CPUS:-0.20}"
    restart: unless-stopped
    depends_on:
      tuner:
        condition: service_completed_successfully

  web:
    build: .
    image: t-bot-local-app
    init: true
    environment:
      <<: *app-environment
      PORT: "8369"
    ports:
      - "${WEB_PORT:-8369}:8369"
    volumes: *tuning-volume
    depends_on:
      tuner:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8369/health/', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
      start_interval: 2s
    mem_limit: ${WEB_MEMORY:-512m}
    cpus: "${WEB_CPUS:-0.50}"
    restart: unless-stopped

  backtest-worker:
    build: .
    image: t-bot-local-app
    init: true
    command: /app/docker/worker-entrypoint.sh
    environment:
      <<: *app-environment
      AUTOSTART_BOTS: "False"
      CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-INFO}
    volumes: *tuning-volume
    depends_on:
      tuner:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A trading_bot_project inspect ping -d celery@$$(hostname) --timeout 5 | grep -q pong",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
      start_interval: 5s
    mem_limit: ${WORKER_MEMORY:-512m}
    cpus: "${WORKER_CPUS:-0.50}"
    pids_limit: 64
    restart: unless-stopped

  scheduler:
    build: .
    image: t-bot-local-app
    init: true
    profiles: ["scheduler"]
    command: /app/docker/beat-entrypoint.sh
    environment:
      <<: *app-environment
      AUTOSTART_BOTS: "False"
      CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-INFO}
    volumes: *tuning-volume
    depends_on:
      tuner:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: ${SCHEDULER_MEMORY:-192m}
    cpus: "${SCHEDULER_CPUS:-0.20}"
    restart: unless-stopped

volumes:
  postgres_data:
  tuning_runtime:
