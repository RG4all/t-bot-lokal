# Render Blueprint: Django/Channels Paper-Trading-Bot + PostgreSQL.
# Auf dem Free-Plan schläft der Web-Service bei Inaktivität ein; dadurch kann
# der In-Process-Bot dort nicht garantiert rund um die Uhr laufen.
services:
  - type: web
    name: t-bot-web
    runtime: docker
    plan: free
    region: frankfurt
    branch: tbot.local
    dockerfilePath: ./Dockerfile
    # Kein dockerCommand-Override: Render verwendet den exec-form CMD aus dem
    # Dockerfile. Dadurch gibt es keine zweite Shell-/Quote-Ebene.
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PASSPHRASE
        generateValue: true
      - key: PASSPHRASE_GATE_ENABLED
        value: "True"
      - key: DEBUG
        value: "False"
      - key: RENDER
        value: "True"
      - key: AUTOSTART_BOTS
        value: "True"
      - key: RENDER_POSTGRES_REGION
        value: "frankfurt"
      - key: DATABASE_URL
        fromDatabase:
          name: t-bot-db
          property: connectionString

databases:
  - name: t-bot-db
    plan: free
    region: frankfurt
    databaseName: tbot_db
    user: tbot
    postgresMajorVersion: "18"
